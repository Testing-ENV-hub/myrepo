
version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.11
    steps:
      - checkout
      - run:
          name: Check Python Version
          command: python --version
      - run:
          name: Run Tests
          command: |
            if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
            if [ -d tests ]; then
              pip install pytest
              pytest tests/
            else
              echo "No tests directory found. Skipping tests."
            fi

workflows:
  test-workflow:
    jobs:
      - test
